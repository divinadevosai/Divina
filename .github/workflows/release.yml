# Builds Divina and publishes a GitHub release with the files attached, either
# when a version tag (v1.2.3) is pushed, or from Actions → Release → Run
# workflow, which tags the current commit with package.json's version.
# See docs/RELEASE.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tools (NSIS for the Windows installer)
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Version from package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Windows installers
        env:
          DIVINA_WIN_SIGN: ${{ secrets.DIVINA_WIN_SIGN }}
        run: npm run build:windows

      - name: Browser edition
        run: npm run build:web

      - name: Collect files and checksums
        run: |
          mkdir release
          cp "dist/Divina-Setup-$VERSION.exe" "dist/Divina-Setup-$VERSION-web.exe" "dist/divina-web-$VERSION.zip" release/
          cp "dist/Divina-Setup-$VERSION.exe" release/Divina-Setup.exe
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --title "Divina $VERSION" \
            --notes "Divina $VERSION, free and open source (AGPL-3.0).

          **Windows:** download \`Divina-Setup.exe\` and run it. It isn't code-signed yet, so Windows may say \"Windows protected your PC\": choose More info → Run anyway. Check the file against \`SHA256SUMS.txt\` if you like.

          **Browser:** use it at https://divinaos.site/app/, or host \`divina-web-$VERSION.zip\` yourself.

          Mac and Linux are coming soon. Bring your own AI key (Gemini, Claude or OpenAI)."
